<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="مكتبة المنتجات الرقمية — كتب، قوالب، خطوط، وملفات تعليمية للتحميل المجاني" />
  <title>مكتبة المنتجات الرقمية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <a href="/my-library/" class="logo">
        <span class="logo-icon">📚</span>
        <span class="logo-text">مكتبتي</span>
      </a>
      <div class="nav-actions">
        <button id="themeToggle" class="icon-btn" aria-label="تبديل الوضع الليلي">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <header class="hero">
    <div class="hero-content">
      <span class="hero-badge">✨ محتوى مجاني ومحدّث باستمرار</span>
      <h1>مكتبة المنتجات الرقمية</h1>
      <p>كتب، قوالب تصميم، خطوط عربية، وملفات تعليمية — كل ما تحتاجه في مكان واحد</p>
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="search" id="searchInput" placeholder="ابحث عن منتج..." aria-label="بحث" />
      </div>
    </div>
  </header>

  <section class="categories-section">
    <div class="container">
      <div id="categories" class="categories"></div>
    </div>
  </section>

  <main class="container">
    <div id="productsGrid" class="products-grid">
      <div class="loading">
        <div class="spinner"></div>
        <p>جارٍ تحميل المنتجات...</p>
      </div>
    </div>
    <div id="emptyState" class="empty-state" hidden>
      <p>لا توجد منتجات مطابقة للبحث.</p>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© <span id="year"></span> مكتبة المنتجات الرقمية — جميع الحقوق محفوظة</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
