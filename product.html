<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تفاصيل المنتج — مكتبة المنتجات الرقمية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <span class="logo-icon">📚</span>
        <span class="logo-text">مكتبتي</span>
      </a>
      <div class="nav-actions">
        <button id="themeToggle" class="icon-btn" aria-label="تبديل الوضع الليلي">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <a href="index.html" class="admin-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          الرئيسية
        </a>
      </div>
    </div>
  </nav>

  <main class="container product-detail-container">
    <div id="productDetail">
      <div class="loading">
        <div class="spinner"></div>
        <p>جارٍ تحميل المنتج...</p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© <span id="year"></span> مكتبة المنتجات الرقمية — جميع الحقوق محفوظة</p>
    </div>
  </footer>

  <script>
    const DATA_URL = "data/products.json";
    const PLACEHOLDER_ICONS = {
      "كتب PDF": "📕",
      "قوالب تصميم": "🎨",
      "خطوط مجانية": "✒️",
      "ملفات تعليمية": "📄",
      "أخرى": "📦"
    };

    function initTheme() {
      const saved = localStorage.getItem("theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const theme = saved || (prefersDark ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
      document.getElementById("themeToggle").addEventListener("click", () => {
        const current = document.documentElement.getAttribute("data-theme");
        const next = current === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
      });
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[s]));
    }

    function getQueryId() {
      const params = new URLSearchParams(window.location.search);
      const id = parseInt(params.get("id"), 10);
      return isNaN(id) ? null : id;
    }

    async function loadProduct() {
      const id = getQueryId();
      const container = document.getElementById("productDetail");

      if (id === null) {
        container.innerHTML = `<div class="detail-error"><h2>المنتج غير موجود</h2><p>الرابط الذي فتحته غير صحيح.</p><a href="index.html" class="download-btn">العودة إلى المكتبة</a></div>`;
        return;
      }

      try {
        const res = await fetch(DATA_URL, { cache: "no-cache" });
        if (!res.ok) throw new Error("فشل");
        const data = await res.json();
        const items = Array.isArray(data.items) ? data.items : [];
        const product = items[id];

        if (!product) {
          container.innerHTML = `<div class="detail-error"><h2>المنتج غير موجود</h2><p>ربما تم حذفه أو تغيير الرابط.</p><a href="index.html" class="download-btn">العودة إلى المكتبة</a></div>`;
          return;
        }

        const icon = PLACEHOLDER_ICONS[product.category] || "📦";
        const imageHTML = product.image
          ? `<img src="${product.image}" alt="${escapeHtml(product.title)}" />`
          : `<div class="detail-placeholder">${icon}</div>`;

        const metaHTML = [
          product.category ? `<span class="meta-tag">${escapeHtml(product.category)}</span>` : "",
          product.size ? `<span class="meta-tag">📦 ${escapeHtml(product.size)}</span>` : "",
          product.version ? `<span class="meta-tag">v${escapeHtml(product.version)}</span>` : ""
        ].filter(Boolean).join("");

        const componentsList = Array.isArray(product.components) && product.components.length
          ? `<div class="detail-section">
              <h2>المكونات والمحتويات</h2>
              <ul class="detail-list check-list">
                ${product.components.map(c => `<li>${escapeHtml(c.text || c)}</li>`).join("")}
              </ul>
            </div>`
          : "";

        const featuresList = Array.isArray(product.features) && product.features.length
          ? `<div class="detail-section">
              <h2>المميزات</h2>
              <ul class="detail-list star-list">
                ${product.features.map(f => `<li>${escapeHtml(f.text || f)}</li>`).join("")}
              </ul>
            </div>`
          : "";

        const longDesc = product.longDescription
          ? `<div class="detail-section">
              <h2>الوصف التفصيلي</h2>
              <p class="detail-text">${escapeHtml(product.longDescription).replace(/\n/g, "<br>")}</p>
            </div>`
          : "";

        container.innerHTML = `
          <a href="index.html" class="back-link">→ العودة إلى المكتبة</a>

          <div class="detail-hero">
            <div class="detail-image">
              ${imageHTML}
            </div>
            <div class="detail-info">
              <h1 class="detail-title">${escapeHtml(product.title || "بدون عنوان")}</h1>
              ${metaHTML ? `<div class="product-meta">${metaHTML}</div>` : ""}
              ${product.description ? `<p class="detail-short">${escapeHtml(product.description)}</p>` : ""}

              <a class="download-btn detail-download" href="${product.file || "#"}" download>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                  <polyline points="7 10 12 15 17 10"/>
                  <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                تحميل المنتج
              </a>
            </div>
          </div>

          ${longDesc}
          ${componentsList}
          ${featuresList}
        `;
      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="detail-error"><h2>خطأ</h2><p>تعذر تحميل المنتج. حاول لاحقًا.</p><a href="index.html" class="download-btn">العودة إلى المكتبة</a></div>`;
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("year").textContent = new Date().getFullYear();
      initTheme();
      loadProduct();
    });
  </script>
</body>
</html>
