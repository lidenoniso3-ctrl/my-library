backend:
  name: github
  repo: lidenoniso3-ctrl/my-library
  branch: main

locale: ar
media_folder: "assets/uploads"
public_folder: "assets/uploads"

site_url: https://lidenoniso3-ctrl.github.io/my-library
display_url: https://lidenoniso3-ctrl.github.io/my-library

collections:
  - name: "products"
    label: "المنتجات الرقمية"
    label_singular: "منتج"
    description: "أضف وعدّل منتجاتك الرقمية من هنا"
    files:
      - name: "products_list"
        label: "قائمة المنتجات"
        file: "data/products.json"
        fields:
          - label: "المنتجات"
            name: "items"
            label_singular: "منتج"
            widget: "list"
            summary: "{{fields.title}} — {{fields.category}}"
            fields:
              - { label: "اسم المنتج", name: "title", widget: "string", hint: "عنوان واضح وجاذب" }
              - { label: "الوصف", name: "description", widget: "text", required: false, hint: "شرح مختصر عن المنتج وفوائده" }
              - label: "التصنيف"
                name: "category"
                widget: "select"
                options:
                  - "كتب PDF"
                  - "قوالب تصميم"
                  - "خطوط مجانية"
                  - "ملفات تعليمية"
                  - "أخرى"
              - { label: "صورة الغلاف", name: "image", widget: "image", required: false, hint: "يفضل 1200x750 بكسل" }
              - { label: "الملف المرفق", name: "file", widget: "file", hint: "ارفع الكتاب، القالب، أو الخط هنا" }
              - { label: "الحجم", name: "size", widget: "string", required: false, hint: "مثال: 8.4 MB" }
              - { label: "الإصدار", name: "version", widget: "string", required: false, hint: "مثال: 1.0" }